[project]
name = "warden"
version = "0.1.0"
description = "Policy-as-code autonomy boundary for a Slack security-triage agent"
requires-python = ">=3.12"
dependencies = [
  "slack-bolt>=1.20",
  "slack-sdk>=3.33",
  "mcp>=1.2",
  "groq>=1.5",
  "httpx>=0.27",
  "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "mcp_server", "slack_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
